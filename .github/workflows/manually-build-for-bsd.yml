name: manually build package for FreeBSD/NetBSD/OpenBSD

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:

      package-name:
        description: input the package name to be built
        required: true

      # https://ftp.netbsd.org/pub/NetBSD/
      # https://cdn.openbsd.org/pub/OpenBSD/
      # https://archive.freebsd.org/old-releases/amd64/
      target:
        description: choose a target to be built for
        type: choice
        options:
          - freebsd-15.1-amd64
          - freebsd-15.0-amd64
          - freebsd-14.4-amd64
          - freebsd-14.3-amd64
          - freebsd-14.2-amd64
          - freebsd-14.1-amd64
          - freebsd-14.0-amd64
          - freebsd-13.5-amd64
          - freebsd-13.4-amd64
          - freebsd-13.3-amd64
          - freebsd-13.2-amd64
          - freebsd-13.2-amd64
          - freebsd-13.1-amd64
          - freebsd-13.0-amd64
          - openbsd-7.9-amd64
          - openbsd-7.8-amd64
          - openbsd-7.7-amd64
          - openbsd-7.6-amd64
          - openbsd-7.5-amd64
          - openbsd-7.4-amd64
          - openbsd-7.3-amd64
          - netbsd-10.1-amd64
          - netbsd-10.0-amd64
          - netbsd-9.4-amd64
          - netbsd-9.3-amd64
          - netbsd-9.2-amd64
          - netbsd-9.1-amd64

      profile:
        description: choose a build profile
        type: choice
        options:
          - release
          - debug

      bundle-type:
        description: choose a bundle type
        type: choice
        options:
          - .tar.xz
          - .tar.lz
          - .tar.gz
          - .tar.bz2
          - .zip

      log-level:
        description: choose a log-level
        type: choice
        options:
          - ''
          - '-q'
          - '-v'
          - '-x'

      syspm:
        description: use system package manager instaed of uppm
        type: boolean
        default: false

      static:
        description: create fully statically linked executables
        type: boolean
        default: false

      cross-compiling:
        description: cross compiling
        type: boolean
        default: false

      publish:
        description: publish as GitHub release
        type: boolean
        default: false

      tagname:
        description: GitHub release tagname
        required: false



jobs:

  base:

    runs-on: ubuntu-latest

    steps:
      - id:  prepare
        run: |
          TARGET_PLATFORM_NAME="$(printf '%s\n' ${{ github.event.inputs.target }} | cut -d- -f1)"
          TARGET_PLATFORM_VERS="$(printf '%s\n' ${{ github.event.inputs.target }} | cut -d- -f2)"

          printf 'TARGET_PLATFORM_NAME=%s\n' "$TARGET_PLATFORM_NAME" >> "$GITHUB_OUTPUT"
          printf 'TARGET_PLATFORM_VERS=%s\n' "$TARGET_PLATFORM_VERS" >> "$GITHUB_OUTPUT"

          if [ ${{ github.event.inputs.syspm }} = true ] ; then
            SYSPM=--syspm
          else
            SYSPM=
          fi

          if [ ${{ github.event.inputs.static }} = true ] ; then
            STATIC=--static
          else
            STATIC=
          fi

          printf 'SYSPM=%s\n' "$SYSPM" >> "$GITHUB_OUTPUT"
          printf 'STATIC=%s\n' "$STATIC" >> "$GITHUB_OUTPUT"


    outputs:
      target-platform-name: ${{ steps.prepare.outputs.TARGET_PLATFORM_NAME }}
      target-platform-vers: ${{ steps.prepare.outputs.TARGET_PLATFORM_VERS }}
      syspm: ${{ steps.prepare.outputs.SYSPM }}
      static: ${{ steps.prepare.outputs.STATIC }}


  cross:
    if : ${{ github.event.inputs.cross-compiling == 'true' }}

    needs: base

    runs-on: ubuntu-latest

    steps:
      - run: sudo apt -y update
      - run: sudo apt -y install clang lld

      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ppkg/master/ppkg
      - run: chmod a+x ppkg

      - run: ./ppkg setup ${{ needs.base.outputs.syspm }}
      - run: ./ppkg update

      - run: ./ppkg install ${{ github.event.inputs.target }}/${{ github.event.inputs.package-name }} --profile=${{ github.event.inputs.profile }} ${{ github.event.inputs.log-level }} ${{ needs.base.outputs.static }}

      - run: ./ppkg bundle  ${{ github.event.inputs.target }}/${{ github.event.inputs.package-name }} ${{ github.event.inputs.bundle-type }}

      - id: filename
        run: printf 'FILENAME=%s\n' "$(ls *${{ github.event.inputs.bundle-type }})" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.filename.outputs.FILENAME }}
          path: ${{ steps.filename.outputs.FILENAME }}


  native:
    if : ${{ github.event.inputs.cross-compiling != 'true' }}

    needs: base

    runs-on: ubuntu-latest

    steps:
      - run: curl -LO https://curl.se/ca/cacert.pem

      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ppkg/master/ppkg
      - run: chmod a+x ppkg

      - uses: cross-platform-actions/action@master
        with:
          operating_system: ${{ needs.base.outputs.target-platform-name }}
          version: ${{ needs.base.outputs.target-platform-vers }}
          shell: bash
          run: |
            run() {
              printf "\033[0;35m==>\033[0m \033[0;32m%b\n\033[0m" "$*"
              eval "$@"
            }

            run export SSL_CERT_FILE="$PWD/cacert.pem"

            run ./ppkg setup ${{ needs.base.outputs.syspm }}
            run ./ppkg update
            run ./ppkg install ${{ github.event.inputs.target }}/${{ github.event.inputs.package-name }} --profile=${{ github.event.inputs.profile }} ${{ github.event.inputs.log-level }} ${{ needs.base.outputs.static }}
            run ./ppkg bundle  ${{ github.event.inputs.target }}/${{ github.event.inputs.package-name }} ${{ github.event.inputs.bundle-type }}

      - id: filename
        run: printf 'FILENAME=%s\n' "$(ls *${{ github.event.inputs.bundle-type }})" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.filename.outputs.FILENAME }}
          path: ${{ steps.filename.outputs.FILENAME }}


  publish:
    needs: build
    if: github.event.inputs.publish == 'true'

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: .
          merge-multiple: true

      - run: ls -a

      # to avaid: failed to run git: fatal: not a git repository (or any of the parent directories): .git
      - run: git -c init.defaultBranch=master init
      - run: git remote add origin ${{ github.repositoryUrl }}

      - id: filename
        run: printf 'FILENAME=%s\n' "$(ls *${{ github.event.inputs.bundle-type }})" >> "$GITHUB_OUTPUT"

      - id: tagname
        run: |
          if [ -z "${{ github.event.inputs.tagname }}" ] ; then
              TAGNAME='${{ steps.filename.outputs.FILENAME }}'
          else
              TAGNAME='${{ github.event.inputs.tagname }}'
          fi

          printf 'TAGNAME=%s\n' "$TAGNAME" >> "$GITHUB_OUTPUT"

      - run: gh release create ${{ steps.tagname.outputs.TAGNAME }} ${{ steps.filename.outputs.FILENAME }} --title ${{ steps.tagname.outputs.TAGNAME }} --notes 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
